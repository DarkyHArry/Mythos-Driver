name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WDK required
        run: |
          echo "This project requires the Windows Driver Kit (WDK) and Visual Studio C++ workload."
          echo "GitHub-hosted runners do not include the WDK. Build on a self-hosted Windows runner with WDK installed, or locally."
          exit 0
